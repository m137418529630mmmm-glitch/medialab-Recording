name: Build medialab recording (Tauri v2)

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Download FFmpeg Essentials (ffmpeg.exe only)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/bin | Out-Null
          $zipPath = Join-Path $env:TEMP "ffmpeg-essentials.zip"
          $extractDir = Join-Path $env:TEMP "ffmpeg-essentials"
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile $zipPath
          if (Test-Path $extractDir) { Remove-Item -Recurse -Force $extractDir }
          Expand-Archive -Path $zipPath -DestinationPath $extractDir -Force
          $ffmpeg = Get-ChildItem -Path $extractDir -Filter "ffmpeg.exe" -Recurse | Select-Object -First 1
          if (-not $ffmpeg) { throw "ffmpeg.exe not found in archive" }
          Copy-Item -Path $ffmpeg.FullName -Destination "src-tauri/bin/ffmpeg.exe" -Force
          Remove-Item -Force $zipPath
          Remove-Item -Recurse -Force $extractDir

      - name: Install frontend dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Prepare updater config if signing key is missing
        shell: pwsh
        env:
          HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          if ($env:HAS_SIGNING_KEY -ne 'true') {
            Write-Host "::notice::TAURI_SIGNING_PRIVATE_KEY not set yet - building unsigned NSIS setup. Add the secret to enable signed auto-updates."
            $confPath = "src-tauri/tauri.conf.json"
            $json = Get-Content $confPath -Raw | ConvertFrom-Json
            $json.bundle.createUpdaterArtifacts = $false
            $json | ConvertTo-Json -Depth 15 | Set-Content $confPath -Encoding utf8
          }

      - name: Build Tauri v2 Windows Installer (Unsigned Preview)
        if: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY == '' }}
        run: npm run dist

      - name: Build & Publish Signed Release (With Auto-Updater)
        if: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'medialab recording v__VERSION__'
          releaseBody: 'Download the Windows installer below, or update automatically from inside the app.'
          releaseDraft: false
          prerelease: false

      - name: Upload NSIS Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: medialab-recording-Tauri-Windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
